<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makhanda Info Hub</title>

    <link rel="stylesheet" href="makhandaInfoHub.css">
    <link rel="stylesheet" href="https:cdnj.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>
    <!--Top bar-->
   <div class="container">

<header class="topbar">
    <h2> M-LINK Makhanda Info Hub</h2>
    <div class="user">
<i class="fa-solid fa-water"></i>
communication officer
    </div>
</header>

<!-- Main Content -->
 <div class="title">
    <h1>Makhanda Info Hub</h1>
    <p>update public facing Information displayed on M-LINK Page</p>
</div>
<!-- General Information -->
<section class="card">

    <h3><i class="fa-solid fa-water"></i>General Information</h3>

    <label>Town Name</label>
    <input type="text" value="makhanda">

    <label> population</label>
    <input type="number" placeholder="enter population">
    
    <label>About Makhanda</label>
    <textarea rows="4" placeholder="Brief description..."></textarea>

    <button>Save Information</button>
</section>

<!-- Dam & Weather -->
 <div class="grid">
    <section class="card>
       <h3><i class="fa-solid fa-water">Dam levels</i></h3> 
       <label>Dam name</label>
       <select>
        <option>Howieson's poort dam</option>
        <option>Settlers Dam</option>
        <option>James Kleynhans Dam</option>
       </select>

       <label>Current water levels %</label>
       <input type="number" placeholder="78">

       <label> status </label>
       <select>
        <option> Normal</option>
        <option> Warning</option>
        <option> Critical</option>
       </select>
       <button>Update Dam Level</button>
    </section>

    <section class="card">
        <h3><i class="fa-solid fa-cloud-sun"></i>Weather</h3>
<label>Temperature (°C)</label>
<input type="number" placeholder="22">

<label>weather condition</label>
<select>
    <option>sunny</option>
    <option>cloudy</option>
    <option>Rain</option>
    <option>windy</option>
</select>

<label>Wind speed</label>
<input type="text" placeholder="18km/h">

<button>Update weather</button>
    </section>

 </div>

 <!-- Contacts -->
 <section class="card">

<h3><i class="fa-solid fa-phone"></i> Community Contacts</h3>

<div class="grid2">

 <div>
 <label>Municipality</label>
<input type="text" placeholder="046 xxx xxxx">
 </div>

 <div>
 <label>Water Services</label>
<input type="text" placeholder="046 xxx xxxx">
</div>

<div>
 <label>Electricity</label>
<input type="text" placeholder="046 xxx xxxx">
</div>

<div>
    <label>Emergency</label>
<input type="text" placeholder="112">
 </div>

            </div>

            <button>Save Contacts</button>

        </section>

        <!-- Ward Information -->
 <section class="card">

<h3><i class="fa-solid fa-location-dot"></i> Ward Information</h3>

<div class="grid2">

<div>
<label>Ward Number</label>
 <input type="number" placeholder="5">
                </div>

<div>
       <label>Councillor Name</label>
  <input type="text" placeholder="Faith Mlambo">
</div>

<div>
     <label>Community Hall</label>
 <input type="text" placeholder="Ward 5 Hall">
 </div>
<div>
 <label>Meeting Date</label>
                    <input type="date">
</div>

            </div>

            <button>Update Ward Information</button>

        </section>

        <!-- Public Statistics -->
        <section class="card">

            <h3><i class="fa-solid fa-chart-column"></i> Public Statistics</h3>

 <div class="stats">

 <div>
 <label>Total Faults</label>
   <input type="number" value="1245">
 </div>

 <div>
 <label>Resolved</label>
 <input type="number" value="1087">
</div>

<div>
<label>Open Faults</label>
 <input type="number" value="158">
 </div>

<div>
<label>Active Notices</label>
<input type="number" value="12">
</div>

</div>

<button>Update Statistics</button>

</section>

</main>


</div> 
</body>
</html>
