<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile settings</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <nav class="navbar"> 
        <div class="logo">
            <img src="MakanaLogo.svg" alt="Makhanda logo">
        </div> 
        <ul class="nav-links">
            <li><a href="#" class="link"> Home </a></li>
            <li><a href="#" class="link"> Fault </a></li>
            <li><a href="#" class="link"> About us </a></li>
            <li><a href="#" class="link"> Notices  </a></li>
            <div id="navbuttons">
                <li><a href="#" class="btn"> Login </a></li>
                <li><a href="#" class="btn"> Sign up </a></li>
            </div>
        </ul> 
    </nav>
    <hr>
    <br><br>
    <h1>Profile Settings</h1>
    <br><br> 
    <h2>Personal Information</h2>
    <div class="settings-container">
        <div class="profile-picture">
            <img src="" alt="Profile Picture" class="profile-image" id="profileImage" onclick="document.getElementById('imageUpload').click();">
        </div>

        <input type="file" id="imageUpload" accept="image/*" style="display:none;">

        <div class="picture-buttons">
            <button type="button" class="upload-btn" onclick="document.getElementById('imageUpload').click();">Upload New Picture</button>
            <button type="button" class="delete-btn">Delete Picture</button>
        </div> 
        <div class="profile-form">

            <div class="input-group">
                <label>First Name</label>
                <input type="text" placeholder="Enter your First name">
            </div>

            <div class="input-group">
                <label>Last Name</label>
                <input type="text" placeholder="Enter your Last name">
            </div>

            <div class="input-group">
                <label>Username</label>
                <input type="text" placeholder="Username">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Email Address">
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="Phone Number">
            </div>

            <div class="input-group">
                <label>Ward Number</label>
                <select>
                    <option>Ward 1</option>
                    <option>Ward 2</option>
                    <option>Ward 3</option>
                    <option>Ward 4</option>
                    <option>Ward 5</option>
                    <option>Ward 6</option>
                    <option>Ward 7</option>
                    <option>Ward 8</option>
                    <option>Ward 9</option>
                    <option>Ward 10</option>
                    <option>Ward 11</option>
                    <option>Ward 12</option>
                    <option>Ward 13</option>
                    <option>Ward 14</option>
                </select>
            </div>
            <button class="save-btn">Save Changes</button>

        </div>
    </div>
    <br><br> 
    <h2>Account Settings</h2>
    <div class="account-settings">
        <button class="setting-btn">Reset Password</button>
        <button class="setting-btn">Notifications</button>
        <button class="setting-btn">Switch Language</button>
        <button class="delete-account">Delete Account</button>
        <button class="logout-btn">Log Out</button>
    </div>

    <script src="profile_settings.js"></script>
    </body>
    </html>
