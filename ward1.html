<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward 1</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background: #f4f4f4;
            color: #333;
        }
        header{
            background: #B5B35C;
            color: #f4f4f4;
            padding: 10px;
            text-align: center;
        }
        .container{
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
            padding: 20px;
        }
        .box{
            background: #f4f4f4;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 5px;
        }
        h2 {
            margin-top: 0;
            font-size: medium;
            color: #8B5E3C;
        }
        .center-column{
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        footer{
            background: #B5B35C;
            color: #f4f4f4;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
        @media(max-width: 760px){
            .container{
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>WARD 1</h1>
    </header>

    <div class="container">

        <div class="box">
            <h2>Ward Map</h2>
            <img src="" alt="Ward 1 Map" class="map-img">
        </div>

        <div class="center-column">
            <div class="box">
            <h2>Current Issues</h2>
            <ul id="issues-list"></ul>
        </div>
         <div class="box">
            <h2>Notices</h2>
            <ul id="notices-list"></ul>
        </div>
         <div class="box">
            <h2>Service Update</h2>
            <p id="service-update">No updates yet</p>
        </div>
         <div class="box">
            <h2>Ward Summary Report</h2>
            <p id="summary-report">Reports will be generated here</p>
        </div>  
    </div>

    <div class="box">
        <h2>Ward Councillor</h2>
        <img src="councillor1.jpg" alt="Ward Councillor" class="councillor-img">
        <p id="councillor-info">Councillor details go here.</p>
    </div>
    </div>

    <footer>
        &copy; 2026 M-Link System
    </footer>
    
    <script>
        const issues = ["Water outage in Joza"];
        const notices = ["Community meeting"];
        const issuesList = document.getElementById("issues-list");
        issues.forEach(issue => {
            const li = document.createElement("li");
            li.textContent = issue;
            issuesList.appendChild(li);
        });

        const noticesList = document.getElementById("notices-list");
        notices.forEach(notice => {
            const li = document.createElement("li");
            li.textContent = notice;
            noticesList.appendChild(li);
        });

        document.getElementById("service-update").textContent = "Garbage collection delayed due to strikes.";
        document.getElementById("summary-report").textContent = "Ward 1 has 4 ongoing issues, 2 notices and 1 service update";
        document.getElementById("councillor-info").textContent = "Cllr Phumelele Peter, Contact: ppeter@makana.gov.za/ pphumelele561@gmail.com";
        
    </script>
</body>
</html>
