<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile settings</title>
    <link rel="stylesheet" href="settings.css">
    <link rel="stylesheet" href="dashboardSideBar.css">

    <style>
        
    </style>
</head>
<body>

    <input type="checkbox" id="sidebarToggle">
    <label for="sidebarToggle" class="hamburger">
        <span></span><span></span><span></span>
    </label>
    <aside class="sidebar">
        
        <nav class="navigation">
            <img src="MakanaLogo.svg" height="150" width="150" alt="M-link logo">
            
            <ul>
                <li><a href="#home-section">Dashboard</a></li>
                <li><a href="#appointments-section">Edit Profile Picture</a></li>
                <li><a href="#patient-details-section">Patients</a></li>
                <li><a href="#schedule-section">Schedule</a></li>
            </ul>
        </nav>
        <div class="sidebar-footer">
            <button class="logout-btn"><a href="DoctorLoginPage.html">Logout</a></button>
        </div>
    </aside>


    <div class="settingsHeader">
        <h1>Profile Settings</h1>
    </div>

    <div class="profileContainer">
        <!-- LEFT COLUMN -->
        <aside class="profileCardLeft">
            <div class="profileAvatarWrapper">
                <img src="profile.jpg" alt="Profile Picture" id="profileImage">
                <label for="imageUpload" class="editBadge">
                    <i class="fa-solid fa-pen"></i>
                </label>
                <input type="file" id="imageUpload" accept="image/*" style="display:none;">
            </div>
            
            <h3 class="userName">Roland Donald</h3>
            <p class="userRole">Cashier</p>

            <nav class="profileNavMenu">
                <a href="#personal-info" class="navItem active">
                    <i class="fa-regular fa-user"></i>
                    <span>Personal Information</span>
                </a>
                <a href="#login-password" class="navItem">
                    <i class="fa-solid fa-lock"></i>
                    <span>Password</span>
                </a>
            </nav>
        </aside>

        <!-- ############# RIGHT COLUMN ########################### -->
        <main class="profileCardRight">
            <h2>Personal Information</h2>

            <form class="settingsForm">
                <!-- GENDER-->
                <div class="formGroup genderSelector">
                    <label><input type="radio" name="gender" value="male" checked> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                </div>

                <!-- UPDATE PERSONAL INFORMATION -->
                <div class="formGrid">
                    <div class="inputGroup">
                        <label>First Name</label>
                        <input type="text" value="Roland">
                    </div>

                    <div class="inputGroup">
                        <label>Last Name</label>
                        <input type="text" value="Donald">
                    </div>

                    <div class="inputGroup fullWidth">
                        <label>Email</label>
                            <input type="email" value="rolandDonald@mail.com">
                            <span class="verified-tag"><i class="fa-solid fa-circle-check"></i> Verified</span>
                    </div>

                    <div class="inputGroup fullWidth">
                        <label>Address</label>
                        <input type="text" value="3605 Parker Rd.">
                    </div>

                    <div class="inputGroup">
                        <label>Phone Number</label>
                        <input type="tel" value="(405) 555-0128">
                    </div>

                    <div class="inputGroup">
                        <label>Date of Birth</label>
                        <div class="iconInput">
                            <input type="text" value="1 Feb, 1995">
                            <i class="fa-regular fa-calendar"></i>
                        </div>
                    </div>

                    <div class="inputGroup">
                        <label>Location</label>
                        <select>
                            <option>Atlanta, USA</option>
                        </select>
                    </div>

                    <div class="inputGroup">
                        <label>Postal Code</label>
                        <input type="text" value="30301">
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="formActions">
                    <button type="button" class="btnDiscard">Discard Changes</button>
                    <button type="submit" class="btnSave">Save Changes</button>
                </div>
            </form>
        </main>
    </div>

    <script src="profile_settings.js"></script>
    </body>
</html>
