<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="regisration.css">
    <link rel="stylesheet" href="publicfaultBoard.css">
    <link rel="stylesheet" href="backButton.css">
    <title>Sign Up</title>

    <style>
    </style>
</head>
<body>
    <nav class="navbar"> 
        <div class="logo">
            <a href="index.php"><img src="MakanaLogo.svg" alt="Makhanda logo"></a>
        </div> 
    </nav>

    <div class="backNavWrapper">
        <div class="backNavContainer">
            <a href="javascript:history.back()" class="backBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>Back</span>
            </a>
        </div>
    </div>

    <section class="registration">
        
        <div class="registrationBody">
            <!-- FORM HEADERS -->
            <div class="registrationHeader">
                <div id="registerHeader" class="header-content active">
                    <h4>Registration</h4>
                    <p style="color: #666; margin: 0;">Select your account type to proceed with registration.</p>
                </div>

                <div id="loginHeader" class="header-content">
                    <h4>Sign In</h4>
                    <p style="color: #666; margin: 0;">Welcome back! Enter your details to access your account.</p>
                </div>
            </div>

            <!-- FORM CONTAINER ON THE RIGHT SIDE -->
            <div class="registrationForm">
                
                <!-- REGISTRATION FORM -->
                <form id="registrationForm" action="#" method="POST">
                    
                    <div class="account-type" id="accountTypeSelector">
                        <label>
                            <input type="radio" name="accountType" value="resident" checked>
                            Resident
                        </label>

                        <label>
                            <input type="radio" name="accountType" value="organisation">
                            Organisation
                        </label>
                    </div>

                    <div class="form-wrapper" id="formWrapper">
                        <!-- RESIDENT FORM -->
                        <div id="residentSection" class="section active">
                            <h3>Resident Details</h3>

                            <div class="form-group">
                                <label for="resName">Name</label>
                                <input type="text" id="resName" name="resName" placeholder="Mark" required>
                            </div>

                            <div class="form-group">
                                <label for="resSurname">Surname</label>
                                <input type="text" id="resSurname" name="resSurname" placeholder="Seth" required>
                            </div>

                            <div class="form-group">
                                <label for="resEmail">Email</label>
                                <input type="email" id="resEmail" name="resEmail" placeholder="ms@gmail.com" required>
                            </div>

                            <div class="form-group">
                                <label for="resPassword">Password</label>
                                <input type="password" id="resPassword" name="resPassword" placeholder="Password" required>
                            </div>

                            <div class="form-group">
                                <label for="resSuburb">Suburb</label>
                                <input type="text" id="resSuburb" name="resSuburb" placeholder="St John">
                            </div>

                            <div class="formButtons">
                                <button type="reset">Reset</button>
                                <button type="submit">Submit</button>
                            </div>
                        </div>

                        <!-- ORGANISATION FORM -->
                        <div id="organisationSection" class="section">
                            <h3>Organisation Details</h3>

                            <div class="form-group">
                                <label for="orgName">Organisation Name</label>
                                <input type="text" id="orgName" name="orgName">
                            </div>

                            <div class="form-group">
                                <label for="orgContact">Contact</label>
                                <input type="text" id="orgContact" name="orgContact">
                            </div>

                            <div class="form-group">
                                <label for="orgEmail">Email</label>
                                <input type="email" id="orgEmail" name="orgEmail">
                            </div>

                            <div class="form-group">
                                <label for="orgType">Organisation Type</label>
                                <input type="text" id="orgType" name="orgType">
                            </div>

                            <div class="formButtons">
                                <button type="reset">Reset</button>
                                <button type="submit">Submit</button>
                            </div>
                        </div>

                        <!-- LOGIN SECTION -->
                        <div id="loginSection" class="section">
                            <h3>Account Login</h3>

                            <div class="form-group">
                                <label for="loginUsername">Username</label>
                                <input type="text" id="loginUsername" name="username" placeholder="Username" required>
                            </div>

                            <div class="form-group">
                                <label for="loginPassword">Password</label>
                                <input type="password" id="loginPassword" name="password" placeholder="Password" required>
                            </div>

                            <div class="remember-forgot">
                                <label><input type="checkbox" name="remember"> Remember me</label>
                                <a href="#">Forgot Password?</a>
                            </div>

                            <button type="submit" style="width: 100%; margin-top: 10px;">Login</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- LINKS CONTAINER -->
        <div class="account-signin" id="footerContainer">
            <p id="registerFooter">
                Already have an account? 
                <a onclick="switchPageMode('login')">Sign in here</a>
            </p>
            <p id="loginFooter" style="display: none;">
                Don't have an account? 
                <a onclick="switchPageMode('register')">Register here</a>
            </p>
        </div>
    </section>

    <!-- SCROLLER SCRIPT -->
    <script src="registration.js"></script>
</body>
</html>
