<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us </title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="container-section">
        <div class="contact-info">
            <div class="info-box">
                <i class="icon">📍</i>
                <p> Main Office, High St, Makhanda, 6139</p>
            </div>
            <div class="info-box">
                <i class=" icon">📞</i>
                <p><a href="tel: 0466036131">046 603 6131</a><br>
                   <a href="tel: 0801116134">080 111 6134</a></p>
            </div>
            <div class="info-box">
                <i class="icon">📠</i>
                <p>046 622 9488</p>
            </div>
            <div class="info-box">
                <i class="icon">✉️</i>
                <p><a href="mailto:info@makana.gov.za">info@makana.gov.za</a></p>
            </div>
        </div>

        <form id="contactForm" class="contact-form">
            <h2>Contact Us</h2>

            <label for="name">Enter Name</label>
            <input type="text" id="name" placeholder="Enter your Name" required>
            <label for="email">Enter Email Address</label>
            <input type="email" id="name" placeholder="Enter a valid email address" required>
            <label for="message">Enter your message</label>
            <textarea id="message" placeholder="Enter your message" required></textarea>
            <button type="submit">SUBMIT</button>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>
