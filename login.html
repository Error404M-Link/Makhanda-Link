<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>

body {
    height:80vh ;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(rgb(81, 117, 81));
}


.logs {

    width: 500px;
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}



.logs h1 {
    text-align: center;
    font-size: 36px;
    margin-bottom: 30px;
    color: black;
}



.information {
    width: 95%;
    margin-bottom: 20px;
}


.information input {
    width: 100%;
    height: 50px;
    border: 1px solid #ccc;
    border-radius: 25px;
    padding: 0 20px;
    font-size: 16px;
}


.remember-forgot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    margin-bottom: 25px;
}


.remember-forgot a {
    text-decoration: none;
    color: khaki;
}


.remember-forgot a:hover {
    text-decoration: underline;
}


button {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 25px;
    background: peachpuff;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}


button:hover {
    background: khaki;
}


.registerlink {
    text-align: center;
    margin-top: 25px;
    font-size: 15px;
}


.registerlink a {
    color: rgb(71, 121, 71);
    text-decoration: none;
    font-weight: bold;
}


.registerlink a:hover {
    text-decoration: underline;
}

    </style>
</head>
<body>
    
<div class="logs">
<form action=" ">
    <h1>Login</h1>
    <div class="information">
        <input type=" text " placeholder="Username" required>
    </div>

    <div class="information">
        <input type="password" placeholder="Password" required>
    </div>

    <div class=" remember-forgot">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot Password?</a>
    </div>
    <button type="submit">Login</button>

    <div class="registerlink">
        <p> Don't have an account? <a href="register.html">Register</a></p>
    </div>
</div>



</form>

</body>
</html>
